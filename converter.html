<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flash Harry Order Converter</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f1ec;color:#333;margin:0;padding:0}
.hdr{background:#1a1a1a;color:#c9a84c;padding:20px;font-family:Georgia,serif;font-size:22px;font-style:italic}
.wrap{max-width:900px;margin:0 auto;padding:32px 24px}
h1{font-size:24px;color:#1a1a1a}
.uz{border:2px dashed #bbb;border-radius:12px;padding:40px;text-align:center;background:#fff;margin:24px 0;cursor:pointer;display:block}
.uz input{display:none}
#msg{padding:12px 16px;background:#fff;border-radius:8px;margin-bottom:16px;display:none;border-left:3px solid #c9a84c}
#pr{background:#fff;border-radius:10px;margin-bottom:16px;display:none;overflow:hidden}
#pr .ph{background:#1a1a1a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f5f3ef;padding:8px 12px;text-align:left;border-bottom:2px solid #c9a84c}
td{padding:8px 12px;border-bottom:1px solid #eee}
.nr{text-align:right}
</style>
</head>
<body>
<div class="hdr">Order Converter <span style="font-style:normal;color:#fff;font-size:13px">Flash Harry</span></div>
<div class="wrap">
<h1>Order to Pastel CSV</h1>
<p style="color:#666;font-size:14px;margin:4px 0 24px">Drop a BUCO email or order CSV.</p>
<label class="uz" id="dz">
 <div style="font-size:48px;margin-bottom:8px">📁</div>
 <h2 style="font-size:18px;color:#1a1a1a">Drop an order file here</h2>
 <input type="file" id="fi" accept=".eml,.csv" onchange="go(this.files[0])" style="display:none">
</label>
<div id="msg"></div>
<div id="pr">
<div class="ph"><h3 id="pt">Order Preview</h3><button id="dlbtn" onclick="dl()" style="display:none;background:#c9a84c;color:#1a1a1a;border:none;font-weight:700;padding:10px 24px;border-radius:6px;cursor:pointer">Download CSV</button></div>
<div style="padding:16px 20px;overflow-x:auto"><table><thead><tr><th>Code</th><th>Description</th><th class="nr">Qty</th><th class="nr">Price</th><th class="nr">Total</th></tr></thead><tbody id="tb"></tbody></table></div>
</div></div>
<script src="prices.js"></script>
<script>
var curCsv;
var curCust;
function gp(code,cust){if(cust=="124200"&&C[code])return C[code];if(P[code])return P[code];return null;}
function go(f){if(!f)return;var e=document.getElementById("msg");e.style.display="block";e.textContent="Reading...";var ext=f.name.split(".").pop().toLowerCase();var r=new FileReader();r.onload=function(ev){parse(ev.target.result,ext)};r.readAsText(f);}
function parse(text,ext){text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");if(ext=="eml"){parseEml(text)}else{parseCsv(text)}}
function parseEml(t){var m=t.match(/Order Created \[(\d+)\]/);var b=t.match(/Branch:\s*(.+)/);var ref=m?m[1]:"?";var branch=b?b[1].trim():"";curCust="";var msg=document.getElementById("msg");msg.textContent="BUCO Order "+ref+" ("+branch+")";var items=[];var re=/Supplier Product Code:\s*(\S+)\s*\n\n([^\n]+)\s*\n\n\s*Quantity:\s*([\d.]+)/g;var m2;while((m2=re.exec(t))!==null){var code=m2[1];var desc=m2[2];var qty=parseFloat(m2[3]);var prod=gp(code,"");items.push({code:code,desc:prod?prod[0]:desc,qty:qty,price:prod?prod[1]:0})}if(items.length==0){msg.textContent="No items found";return}showTable(items,ref,"BUCO");buildCsv(items,"123278","THE BUILDING COMPANY (PTY) LTD",ref)}
function parseCsv(t){var lns=t.split("\n").map(function(l){return l.trim()}).filter(function(l){return l.length>0});var hdr=lns.find(function(l){return l.indexOf('"Header"')===0});if(!hdr)return;var h=pCsv(hdr);var cust=(h[4]||"").trim();var po=(h[7]||"").trim();var n=h[4]||"";var isCash=cust=="124200";curCust=isCash?"124200":"";var items=[];for(var i=1;i<lns.length;i++){if(lns[i].indexOf('"Detail"')!==0)continue;var d=pCsv(lns[i]);var code=(d[9]||"").trim();var qty=parseFloat(d[2]||"0");if(!qty)continue;var price=parseFloat(d[3]||"0");items.push({code:code,desc:(d[10]||"").trim(),qty:qty,price:price})}if(items.length==0){document.getElementById("msg").textContent="No items";return}showTable(items,po,isCash?"Cashbuild":"BUCO CSV");buildCsv(items,cust,n,po)}
function pCsv(l){var r=[];var c="";var q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch=='"'){q=!q;continue}if(ch==","&&!q){r.push(c);c="";continue}c+=ch}r.push(c);return r}
function showTable(items,ref,label){var tb=document.getElementById("tb");tb.innerHTML="";var t=0;for(var i=0;i<items.length;i++){var it=items[i];var tr=document.createElement("tr");tr.innerHTML='<td>'+it.code+'</td><td>'+it.desc+'</td><td class="nr">'+it.qty+'</td><td class="nr">R'+it.price.toFixed(2)+'</td><td class="nr">R'+(it.qty*it.price).toFixed(2)+'</td>';tb.appendChild(tr);t+=it.qty*it.price}document.getElementById("dlbtn").style.display="";document.getElementById("pt").textContent=label+": "+ref;var m=document.getElementById("msg");m.textContent='"+items.length+" items, R'+t.toFixed(2)+" total";m.style.borderLeftColor="#2e7d32"}
function buildCsv(items,cust,name,po){var d=new Date().toISOString().slice(0,10).replace(/-/g,"");var ls=["Header,SO000001, , ,"+cust+",7,"+d+","+po+",N,0,"+name];for(var i=0;i<items.length;i++){var it=items[i];var tot=it.qty*it.price;ls.push("Detail,0,"+it.qty+","+it.price.toFixed(2)+","+tot.toFixed(2)+",    ,15,0,0,"+it.code+","+it.desc+",4,     ,   ")}curCsv=ls.join("\n")}function dl(){if(!curCsv)return;var b=new Blob([curCsv],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="pastel_import_"+new Date().toISOString().slice(0,10).replace(/-/g,"")+".csv";a.click()}var dz=document.getElementById("dz");dz.addEventListener("dragover",function(e){e.preventDefault();dz.classList.add("dragover")});dz.addEventListener("dragleave",function(){dz.classList.remove("dragover")});dz.addEventListener("drop",function(e){e.preventDefault();dz.classList.remove("dragover");if(e.dataTransfer.files[0])go(e.dataTransfer.files[0])});</script>
</body>
</html>
